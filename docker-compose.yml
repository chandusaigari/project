services:
  db:
    image: mysql:8.0
    container_name: project2-db-1
    environment:
      MYSQL_ROOT_PASSWORD: your_root_password
      MYSQL_DATABASE: your_db
      MYSQL_USER: your_user
      MYSQL_PASSWORD: your_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  web:
    build: .
    container_name: project-web-1
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db  # ← This must match the service name
    depends_on:
      - db   

networks:
  app-network:
    driver: bridge   
