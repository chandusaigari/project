<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>User Manager</h1>

    <!-- Form -->
    <div class="card">
      <h2 id="form-title">Add User</h2>
      <input  type="hidden"  id="user-id" />
      <input  type="text"    id="name"    placeholder="Full Name"    required />
      <input  type="email"   id="email"   placeholder="Email Address" required />
      <div class="btn-group">
        <button id="save-btn"   onclick="saveUser()">Save</button>
        <button id="cancel-btn" onclick="resetForm()" class="secondary hidden">Cancel</button>
      </div>
    </div>

    <!-- Status -->
    <div id="message" class="message hidden"></div>

    <!-- Table -->
    <div class="card">
      <h2>Users <span id="count" class="badge">0</span></h2>
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Name</th><th>Email</th><th>Created</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="user-table"></tbody>
      </table>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
