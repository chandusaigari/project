<!DOCTYPE html>
<html>
<head>
    <title>Message App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            margin: 0;
            padding: 40px;
            color: white;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #00c6ff;
            color: white;
            font-weight: bold;
        }

        .message {
            background: rgba(255,255,255,0.15);
            padding: 15px;
            margin-top: 10px;
            border-radius: 10px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete-btn {
            background: red;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            color: white;
        }

        .delete-btn:hover {
            opacity: 0.8;
        }
    </style>

</head>
<body>

<div class="container">

    <h1>🚀 Message App</h1>

    <form method="POST">
        <input type="text" name="message" placeholder="Enter message" required>
        <button type="submit">Add</button>
    </form>

    {% for id, message in messages %}
        <div class="message">

            <span>{{ message }}</span>

            <a
                class="delete-btn"
                href="/delete/{{ id }}"
            >
                Delete
            </a>

        </div>
    {% endfor %}

</div>

</body>
</html>
