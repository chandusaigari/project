<!DOCTYPE html>
<html>
<head>
    <title>Message Board</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">   
     
</head>
<body>
    <h1>Submit a Message</h1>
    <form method="POST">
        <input type="text" name="message" required />
        <button type="submit">Send</button>
    </form>

    <h2>Messages:</h2>
    <ul>
        {% for msg in messages %}
            <li class="message">{{ msg }}</li>
        {% endfor %}
    </ul>
</body>
</html>
