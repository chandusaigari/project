<!DOCTYPE html>
<html>
<head><title>Flask MySQL App</title></head>
<body>
  <h1>Insert Message</h1>
  <form method="POST">
    <input type="text" name="message" required placeholder="Enter message" />
    <button type="submit">Submit</button>
  </form>

  <h2>Stored Messages:</h2>
  <ul>
    {% for msg in messages %}
      <li>{{ msg }}</li>
    {% endfor %}
  </ul>
</body>
</html>
